<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications & Announcements | Al Marakish Library</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #9c4dff;
            --primary-glow: rgba(156, 77, 255, 0.4);
            --bg-dark: #080c14;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: white;
            line-height: 1.6;
            min-height: 100vh;
        }

        .main-content {
            margin-left: 260px;
            padding: 40px;
        }

        .page-header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 36px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title h1 i {
            color: var(--primary);
        }

        .post-btn {
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: 0.3s;
        }

        .post-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        .notif-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
        }

        .notif-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            gap: 20px;
            position: relative;
            transition: 0.3s;
        }

        .notif-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .notif-card.unread {
            border-left: 4px solid var(--primary);
            background: rgba(30, 41, 59, 0.9);
        }

        .notif-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .type-announcement .notif-icon {
            background: rgba(156, 77, 255, 0.15);
            color: #9c4dff;
        }

        .type-alert .notif-icon {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .type-info .notif-icon {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .notif-content {
            flex: 1;
        }

        .notif-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .notif-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
        }

        .notif-date {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .notif-message {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.5;
        }

        .notif-meta {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
        }

        .delete-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0;
            transition: 0.2s;
        }

        .notif-card:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: var(--danger);
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #1e293b;
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 30px;
            transform: translateY(20px);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            transition: 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(156, 77, 255, 0.2);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-cancel {
            background: transparent;
            color: #94a3b8;
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .loading-state {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="page-header">
            <div class="header-title">
                <h1><i class="fas fa-bell"></i> Notifications</h1>
                <p style="color: var(--text-muted); margin-top: 5px;">System alerts and announcements.</p>
            </div>
            <button class="post-btn" onclick="openModal()">
                <i class="fas fa-bullhorn"></i> New Announcement
            </button>
        </div>

        <div id="notifList" class="notif-container">
            <div class="loading-state">
                <i class="fas fa-circle-notch fa-spin fa-2x"></i>
                <p style="margin-top: 15px;">Loading notifications...</p>
            </div>
        </div>
    </div>

    <!-- Create Announcement Modal -->
    <div id="announceModal" class="modal">
        <div class="modal-content">
            <h2 style="font-family: 'Outfit', sans-serif; font-size: 24px; margin-bottom: 20px;">Post Announcement</h2>

            <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" id="annTitle" class="form-control" placeholder="e.g. Library Maintenance">
            </div>

            <div class="form-group">
                <label class="form-label">Message</label>
                <textarea id="annMessage" class="form-control" rows="4"
                    placeholder="Enter announcement details..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Target Audience</label>
                <select id="annTarget" class="form-control">
                    <option value="all">Everyone (Students & Staff)</option>
                    <option value="student">Students Only</option>
                    <option value="admin">Admins Only</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-submit" onclick="submitAnnouncement()">Post Announcement</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/api-helper.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Sidebar is automatically handled by sidebar.js including showing/hiding post button based on role if needed, 
            // though sidebar.js handles sidebar elements. 
            // We need to hide the Post button manually here if not admin/owner.

            const user = getUser();
            if (user && user.role !== 'admin' && user.role !== 'owner') {
                const btn = document.querySelector('.post-btn');
                if (btn) btn.style.display = 'none';
            }

            loadPageNotifications();
        });

        async function loadPageNotifications() {
            const list = document.getElementById('notifList');
            try {
                const response = await apiRequest('/notifications');
                if (response.success) {
                    if (response.notifications.length === 0) {
                        list.innerHTML = `
                            <div class="loading-state">
                                <i class="fas fa-bell-slash fa-3x" style="opacity: 0.2; margin-bottom: 20px;"></i>
                                <p>No notifications at the moment.</p>
                            </div>
                        `;
                        return;
                    }

                    list.innerHTML = response.notifications.map(n => {
                        const isAnn = n.source === 'announcement';
                        const typeClass = isAnn ? 'type-announcement' : 'type-info';
                        const icon = isAnn ? 'fa-bullhorn' : 'fa-info-circle';
                        const date = new Date(n.created_at).toLocaleDateString(undefined, {
                            weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                        });

                        return `
                        <div class="notif-card ${typeClass} ${!n.is_read ? 'unread' : ''}">
                            <div class="notif-icon">
                                <i class="fas ${icon}"></i>
                            </div>
                            <div class="notif-content">
                                <div class="notif-header">
                                    <h3 class="notif-title">${n.title}</h3>
                                    <span class="notif-date">${date}</span>
                                </div>
                                <p class="notif-message">${n.message}</p>
                                <div class="notif-meta">
                                    ${isAnn ? `<span class="badge">Announcement to ${n.target_role || 'All'}</span>` : ''}
                                    ${n.created_by ? `<span class="badge">Posted by Admin</span>` : ''}
                                </div>
                            </div>
                            
                            ${getUser().role === 'admin' || getUser().role === 'owner' ? `
                            <button class="delete-btn" onclick="deleteNotification(${n.id}, '${n.source}')" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                            ` : ''}
                        </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                list.innerHTML = `<p style="color: var(--danger); text-align: center;">Failed to load notifications.</p>`;
            }
        }

        /* Modal Functions */
        const modal = document.getElementById('announceModal');

        function openModal() {
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            document.getElementById('annTitle').value = '';
            document.getElementById('annMessage').value = '';
        }

        async function submitAnnouncement() {
            const title = document.getElementById('annTitle').value;
            const message = document.getElementById('annMessage').value;
            const target = document.getElementById('annTarget').value;

            if (!title || !message) {
                showToast('Please fill in title and message', 'warning');
                return;
            }

            try {
                const response = await apiRequest('/notifications/announce', {
                    method: 'POST',
                    body: JSON.stringify({
                        title, message, target_role: target
                    })
                });

                if (response.success) {
                    showToast('Announcement posted!', 'success');
                    closeModal();
                    loadPageNotifications();
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function deleteNotification(id, source) {
            if (!await showModal({
                title: 'Delete Notification',
                message: 'Are you sure you want to delete this?',
                type: 'confirm',
                confirmText: 'Delete',
                cancelText: 'Cancel'
            })) return;

            try {
                const response = await apiRequest(`/notifications/${id}?type=${source}`, {
                    method: 'DELETE'
                });
                if (response.success) {
                    showToast('Deleted successfully', 'success');
                    loadPageNotifications();
                }
            } catch (err) {
                showToast('Failed to delete', 'error');
            }
        }
    </script>
</body>

</html>
