<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Check-In | Al Marakish Library</title>
    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --primary: #c084fc;
            --primary-glow: rgba(192, 132, 252, 0.4);
            --bg-dark: #0f1424;
            --card-bg: rgba(30, 41, 59, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        #sidebar-container {
            width: 240px;
        }

        .main-content {
            flex-grow: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, rgba(20, 30, 60, 1) 0%, rgba(10, 15, 26, 1) 100%);
            position: relative;
            margin-left: 0 !important;
        }

        /* SCANNER HUB */
        .scanner-hub {
            text-align: center;
            width: 100%;
            max-width: 800px;
            z-index: 10;
        }

        .hub-title {
            font-size: 56px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 40px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* THE SCANNER BOX - HIDDEN BUT ACTIVE */
        .barcode-receiver {
            position: absolute;
            top: -1000px;
            opacity: 0;
            pointer-events: none;
        }

        .scanner-visual-zone {
            width: 100%;
            height: 140px;
            background: rgba(192, 132, 252, 0.05);
            border: 2px dashed var(--primary);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(192, 132, 252, 0.1);
        }

        .scanner-visual-zone::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            animation: scannerWave 3s infinite linear;
        }

        @keyframes scannerWave {
            0% {
                top: 0%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        .scanner-status {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
            z-index: 5;
        }

        .scanner-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 5;
        }

        @keyframes scanLine {

            0%,
            100% {
                top: 10%;
            }

            50% {
                top: 90%;
            }
        }

        /* PREVIEW CARD */
        .preview-card {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 30px;
            padding: 40px;
            display: none;
            /* Hidden by default */
            gap: 30px;
            backdrop-filter: blur(20px);
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .card-left {
            flex-shrink: 0;
            width: 180px;
        }

        .book-cover {
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--border);
        }

        .card-right {
            flex-grow: 1;
            text-align: left;
        }

        .book-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            color: white;
        }

        .book-acc {
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 6px;
            color: var(--primary);
            font-weight: 800;
            display: inline-block;
            margin-bottom: 25px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .badge-issued {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .badge-none {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .borrower-info {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            border: 1px dashed var(--border);
            margin-top: 20px;
        }

        .borrower-label {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
            display: block;
        }

        .borrower-name {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .borrower-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ACTIONS */
        .action-bar {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .btn-checkin {
            flex: 1;
            background: var(--success);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-checkin:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        /* SUCCESS VIEW */
        .success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 20, 36, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            z-index: 20;
            text-align: center;
        }

        .success-icon {
            font-size: 100px;
            color: var(--success);
            filter: drop-shadow(0 0 20px var(--success));
            margin-bottom: 20px;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* HELPERS */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounceIn {
            0% {
                scale: 0;
            }

            80% {
                scale: 1.2;
            }

            100% {
                scale: 1;
            }
        }

        .loading-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* PILLS */
        .status-pill {
            position: fixed;
            bottom: 40px;
            right: 40px;
            padding: 12px 24px;
            background: rgba(192, 132, 252, 0.1);
            border: 1px solid var(--primary-glow);
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from {
                opacity: 0.5;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body onclick="document.getElementById('barcode-input').focus()">

    <div id="sidebar-container"></div>

    <div class="main-content">

        <div class="scanner-hub" id="hub-view">
            <h1 class="hub-title">Book Check-In</h1>

            <div class="scanner-visual-zone">
                <input type="text" id="barcode-input" class="barcode-receiver" autofocus autocomplete="off">
                <div class="scanner-status">READY TO SCAN</div>
                <div class="scanner-sub">Librarian: Automated Return Mode</div>
            </div>

            <!-- Result Card -->
            <div id="preview-card" class="preview-card">
                <div class="card-left">
                    <img id="res-cover" src="" class="book-cover">
                </div>
                <div class="card-right">
                    <h2 id="res-title" class="book-title">--</h2>
                    <span id="res-acc" class="book-acc">ACC: --</span>

                    <div id="res-status" class="status-badge">--</div>

                    <div id="borrower-box" class="borrower-info">
                        <span class="borrower-label">Currently Issued To</span>
                        <div class="borrower-name" id="res-student">--</div>
                        <p class="borrower-meta">Due On: <strong id="res-due">--</strong></p>
                    </div>

                    <div class="action-bar" id="action-bar">
                        <button id="btn-submit" class="btn-checkin">
                            <i class="fas fa-undo"></i>
                            Confirm Return
                        </button>
                    </div>
                </div>

                <!-- Succes Animation -->
                <div id="success-overlay" class="success-overlay">
                    <div class="success-icon"><i class="fas fa-check-circle"></i></div>
                    <h2>Check-In Successful</h2>
                    <p style="color: var(--text-muted); margin-top: 10px;">The book has been added back to inventory.
                    </p>
                </div>
            </div>
        </div>

        <div class="status-pill">
            <div class="dot"></div>
            Kiosk System Active
        </div>
    </div>

    <script src="/assets/js/api-helper.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script>
        let matchedTransaction = null;
        let matchedBook = null;

        const ui = {
            input: document.getElementById('barcode-input'),
            card: document.getElementById('preview-card'),
            btn: document.getElementById('btn-submit'),
            overlay: document.getElementById('success-overlay')
        };

        document.addEventListener('DOMContentLoaded', () => {
            ui.input.focus();

            // Scanner input handler
            ui.input.addEventListener('keypress', async (e) => {
                if (e.key === 'Enter') {
                    const code = ui.input.value.trim();
                    ui.input.value = '';
                    if (code) await handleBookScan(code);
                }
            });

            // Action handler
            ui.btn.addEventListener('click', async () => {
                if (!matchedTransaction) return;
                await executeCheckIn();
            });
        });

        async function loadSidebar() {
            const data = await fetch('/admin/sidebar.html').then(r => r.text());
            document.getElementById('sidebar-container').innerHTML = data;
            if (typeof initSidebar === 'function') initSidebar();
        }

        async function handleBookScan(accession_no) {
            // DOUBLE SCAN LOGIC: If same book scanned twice, auto-execute check-in
            if (matchedBook && matchedBook.accession_no === accession_no && matchedTransaction) {
                await executeCheckIn();
                return;
            }

            ui.card.style.display = 'none';
            try {
                const response = await apiRequest(`/circulation/book-details/${accession_no}`);
                if (response.success) {
                    matchedBook = response.book;
                    matchedTransaction = response.transaction;

                    // Update UI
                    document.getElementById('res-cover').src = matchedBook.cover_url;
                    document.getElementById('res-title').textContent = matchedBook.title;
                    document.getElementById('res-acc').textContent = 'ACC: ' + matchedBook.accession_no;

                    const statusEl = document.getElementById('res-status');
                    const borrowerBox = document.getElementById('borrower-box');
                    const actionBar = document.getElementById('action-bar');

                    if (response.is_issued) {
                        statusEl.className = 'status-badge badge-issued';
                        statusEl.innerHTML = '<i class="fas fa-clock"></i> Currently Issued';
                        borrowerBox.style.display = 'block';
                        actionBar.style.display = 'flex';

                        document.getElementById('res-student').textContent = matchedTransaction.student_name;
                        document.getElementById('res-due').textContent = formatDate(matchedTransaction.due_date);

                        // Set button to "Scan Again" mode
                        ui.btn.innerHTML = '<i class="fas fa-barcode"></i> SCAN ONCE MORE TO CONFIRM';
                        ui.btn.style.background = 'var(--warning)';
                        ui.btn.style.cursor = 'default';
                        ui.btn.style.boxShadow = '0 0 20px rgba(245, 158, 11, 0.4)';
                    } else {
                        statusEl.className = 'status-badge badge-none';
                        statusEl.innerHTML = '<i class="fas fa-check-circle"></i> Already in Library';
                        borrowerBox.style.display = 'none';
                        actionBar.style.display = 'none';
                        matchedBook = null; // Don't allow double scan if already in library
                        showToast('Book is not currently checked out.', 'info');
                    }

                    ui.card.style.display = 'flex';
                }
            } catch (err) {
                showToast(err.message || 'Book not found', 'error');
            }
        }

        async function executeCheckIn() {
            ui.btn.disabled = true;
            ui.btn.style.background = 'var(--success)';
            ui.btn.innerHTML = '<div class="loading-ring"></div> Return in Progress...';

            try {
                const res = await apiRequest('/circulation/checkin-standalone', {
                    method: 'POST',
                    body: {
                        transaction_id: matchedTransaction.id,
                        book_id: matchedBook.id
                    }
                });

                if (res.success) {
                    // Success View
                    ui.overlay.style.display = 'flex';

                    // Auto Reset
                    setTimeout(() => {
                        resetUI();
                    }, 2500);
                }
            } catch (err) {
                showToast(err.message, 'error');
                ui.btn.disabled = false;
                ui.btn.style.background = 'var(--warning)';
                ui.btn.innerHTML = '<i class="fas fa-barcode"></i> SCAN ONCE MORE TO CONFIRM';
            }
        }

        function resetUI() {
            ui.overlay.style.display = 'none';
            ui.card.style.display = 'none';
            matchedTransaction = null;
            matchedBook = null;
            ui.btn.disabled = false;
            ui.btn.style.background = 'var(--success)';
            ui.btn.style.cursor = 'pointer';
            ui.btn.style.boxShadow = 'none';
            ui.btn.innerHTML = '<i class="fas fa-undo"></i> Confirm Return';
            ui.input.focus();
        }

    </script>
</body>

</html>
