<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Student | Al Marakish Library</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/owner-pages.css">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-dashboard: #0f1724;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text-secondary: #94a3b8;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background: var(--bg-dashboard);
            color: white;
            line-height: 1.6;
            min-height: 100vh;
        }

        .main-content {
            margin-left: 280px;
            padding: 40px;
            max-width: 1400px;
            margin-right: auto;
        }

        /* Breadcrumbs */
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            font-size: 14px;
            font-weight: 500;
        }

        .breadcrumbs a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: 0.3s;
        }

        .breadcrumbs a:hover {
            color: var(--primary);
        }

        .breadcrumbs i {
            font-size: 10px;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .breadcrumbs span {
            color: white;
        }

        /* Profile Header */
        .profile-header {
            display: flex;
            gap: 40px;
            margin-bottom: 45px;
            align-items: flex-start;
        }

        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 35px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 4px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .profile-avatar i {
            font-size: 60px;
            color: var(--primary);
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.4));
        }

        .status-pill {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .profile-info h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-badges {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        /* Glass Card */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        /* Form Styling */
        .form-section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 25px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-control {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            transition: 0.3s;
        }

        .input-control:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .row-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        /* Custom File Upload */
        .photo-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(15, 23, 36, 0.5);
            border: 3px dashed var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: all 0.3s;
            margin: 0 auto 20px;
        }

        .photo-circle:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .photo-circle i {
            font-size: 40px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .photo-circle p {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 0 20px;
            text-align: center;
        }

        .photo-preview-el {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .photo-circle.active .photo-preview-el {
            display: block;
        }

        .photo-circle.active i,
        .photo-circle.active p {
            display: none;
        }

        /* Buttons */
        .btn-premium {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
        }

        .btn-premium:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(59, 130, 246, 0.3);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: white;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-secondary);
        }

        /* Toast / Message */
        .message-box {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
        }

        .toast {
            background: #1e293b;
            color: white;
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 5px solid var(--primary);
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success {
            border-left-color: var(--success);
        }

        .toast.error {
            border-left-color: #ef4444;
        }

        @media (max-width: 1024px) {
            .main-content {
                margin-left: 0;
                padding: 30px;
            }

            .form-layout {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div id="sidebar-container"></div>
    <div class="message-box" id="toastContainer"></div>

    <div class="main-content">
        <!-- Breadcrumbs -->
        <div class="breadcrumbs">
            <a href="dashboard.html">Dashboard</a>
            <i class="fas fa-chevron-right"></i>
            <a href="users.html">Students</a>
            <i class="fas fa-chevron-right"></i>
            <span id="breadcrumbCurrent">Register New Student</span>
        </div>

        <!-- Profile Header -->
        <div class="profile-header">
            <div class="avatar-container">
                <div class="profile-avatar">
                    <i class="fas fa-user-plus" id="headerIcon"></i>
                    <span class="status-pill" id="headerStatusPill">New Enrollment</span>
                </div>
            </div>
            <div class="profile-info">
                <h1 id="pageTitle">Add New Student</h1>
                <div class="profile-badges">
                    <div class="badge">
                        <i class="fas fa-shield-halved" style="color: var(--primary);"></i> Portal Access Enabled
                    </div>
                    <div class="badge" id="autoIdBadge">
                        <i class="fas fa-id-card" style="color: #10b981;"></i> Auto ID Generation
                    </div>
                </div>
                <div style="display: flex; gap: 15px;">
                    <button class="btn-premium" onclick="document.getElementById('addStudentForm').requestSubmit()">
                        <i class="fas fa-user-check" id="submitBtnIcon"></i> <span id="submitBtnText">Enroll & Create
                            Profile</span>
                    </button>
                    <a href="excel_user_grid_status.html" class="btn-glass" id="bulkImportBtn">
                        <i class="fas fa-file-excel"></i> Bulk Excel Import
                    </a>
                </div>
            </div>
        </div>

        <form id="addStudentForm" style="display: grid; grid-template-columns: 1fr 340px; gap: 30px;"
            class="form-layout">
            <!-- Main Details -->
            <div class="form-side">
                <div class="glass-card">
                    <div class="form-section-title">
                        <i class="fas fa-id-badge"></i> Academic & Personal
                    </div>
                    <div class="row-grid">
                        <div class="input-group">
                            <label class="input-label">Full Name *</label>
                            <input type="text" name="full_name" id="full_name" class="input-control" required
                                placeholder="Johnathan Doe">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Admission Number *</label>
                            <input type="text" name="ad_no" id="ad_no" class="input-control" required
                                placeholder="ADM-2024-001">
                        </div>
                    </div>
                    <div class="row-grid">
                        <div class="input-group">
                            <label class="input-label">Date of Birth</label>
                            <input type="date" name="date_of_birth" id="date_of_birth" class="input-control">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Blood Group</label>
                            <select name="blood_group" id="blood_group" class="input-control">
                                <option value="">Select Group</option>
                                <option>A+</option>
                                <option>A-</option>
                                <option>B+</option>
                                <option>B-</option>
                                <option>AB+</option>
                                <option>AB-</option>
                                <option>O+</option>
                                <option>O-</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label class="input-label">Class / Section</label>
                            <input type="text" name="section" id="section" class="input-control"
                                placeholder="Grade 11-A">
                        </div>
                        <div class="input-group" id="statusGroup" style="display: none;">
                            <label class="input-label">Account Status</label>
                            <select name="status" id="status" class="input-control">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive / Suspended</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section-title" style="margin-top: 20px;">
                        <i class="fas fa-headset"></i> Contact Information
                    </div>
                    <div class="row-grid">
                        <div class="input-group">
                            <label class="input-label">Email Address</label>
                            <input type="email" name="email" id="email" class="input-control"
                                placeholder="name@school.com">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Mobile Number</label>
                            <input type="tel" name="phone" id="phone" class="input-control"
                                placeholder="+91 00000 00000">
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Residential Address</label>
                        <textarea name="address" id="address" class="input-control" rows="3"
                            placeholder="Enter full home address..."></textarea>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Guardian / Emergency Contact</label>
                        <textarea name="contact" id="contact" class="input-control" rows="2"
                            placeholder="Parent Name & Phone..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Side Cards -->
            <div class="side-side">
                <div class="glass-card" style="text-align: center;">
                    <div class="form-section-title">
                        <i class="fas fa-camera"></i> Identitity Photo
                    </div>
                    <div class="photo-circle" id="photoDropArea"
                        onclick="document.getElementById('profile_photo').click()">
                        <i class="fas fa-user-plus"></i>
                        <p>Click or Drag Photo</p>
                        <img id="photoPreview" class="photo-preview-el">
                    </div>
                    <input type="file" name="profile_photo" id="profile_photo" hidden accept="image/*"
                        onchange="handleUIPreview(this)">
                    <button type="button" class="btn-glass"
                        style="width: 100%; justify-content: center; font-size: 13px;" onclick="removeUIPhoto(event)">
                        <i class="fas fa-trash"></i> Remove Photo
                    </button>
                </div>

                <div class="glass-card">
                    <div class="form-section-title">
                        <i class="fas fa-shield-lock"></i> Security
                    </div>
                    <div class="input-group">
                        <label class="input-label">Portal Password *</label>
                        <input type="password" name="password" id="password" class="input-control" required
                            placeholder="Min 6 chars">
                        <p style="font-size: 11px; color: var(--text-secondary); margin-top: 8px;">Used for student
                            log-in</p>
                    </div>
                    <button type="submit" class="btn-premium"
                        style="width: 100%; justify-content: center; margin-top: 10px;" id="submitBtn">
                        <i class="fas fa-save"></i> Save Profile
                    </button>
                    <button type="reset" class="btn-glass"
                        style="width: 100%; justify-content: center; margin-top: 10px; border: none; font-size: 13px;">
                        Clear All
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script src="/assets/js/api-helper.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script>
        // Protect route
        protectRoute('assistant');

        // Load Sidebar
        fetch('/admin/sidebar.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
                if (typeof initSidebar === 'function') initSidebar();
            });

        function handleUIPreview(input) {
            const dropArea = document.getElementById('photoDropArea');
            const preview = document.getElementById('photoPreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    dropArea.classList.add('active');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeUIPhoto(e) {
            e.preventDefault();
            const input = document.getElementById('profile_photo');
            const dropArea = document.getElementById('photoDropArea');
            input.value = '';
            dropArea.classList.remove('active');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('edit');

        document.addEventListener('DOMContentLoaded', async () => {
            if (editId) {
                await setupEditMode();
            }
        });

        async function setupEditMode() {
            try {
                // Update UI for Edit Mode
                document.title = "Edit Student | Al Marakish Library";
                document.getElementById('breadcrumbCurrent').textContent = "Edit Student";
                document.getElementById('pageTitle').textContent = "Edit Student Profile";
                document.getElementById('headerStatusPill').textContent = "Update Mode";
                document.getElementById('headerIcon').className = "fas fa-user-edit";
                document.getElementById('submitBtnText').textContent = "Update Profile";
                document.getElementById('submitBtnIcon').className = "fas fa-save";
                document.getElementById('autoIdBadge').style.display = "none";
                document.getElementById('bulkImportBtn').style.display = "none";
                document.getElementById('statusGroup').style.display = "block";

                // Password is not strictly required in edit mode
                document.getElementById('password').required = false;
                document.getElementById('password').placeholder = "Leave blank to keep current";

                // Fetch Data
                const response = await apiRequest(`/admin/users/${editId}`);
                if (response.success && response.user) {
                    const user = response.user;

                    // Map fields
                    const fields = [
                        'full_name', 'ad_no', 'email', 'phone', 'address',
                        'contact', 'blood_group', 'section', 'status'
                    ];

                    fields.forEach(f => {
                        const el = document.getElementById(f);
                        if (el && user[f] !== undefined && user[f] !== null) {
                            el.value = user[f];
                        }
                    });

                    // Date special handling
                    if (user.date_of_birth) {
                        document.getElementById('date_of_birth').value = user.date_of_birth.split('T')[0];
                    }

                    // Photo handling
                    if (user.profile_photo) {
                        const dropArea = document.getElementById('photoDropArea');
                        const preview = document.getElementById('photoPreview');
                        preview.src = `/uploads/student_photos/${user.profile_photo}`;
                        dropArea.classList.add('active');
                    }
                } else {
                    showToast('Failed to load student data', 'error');
                }
            } catch (error) {
                console.error('Edit mode setup error:', error);
                showToast('Error loading student profile', 'error');
            }
        }

        const form = document.getElementById('addStudentForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const originalHTML = submitBtn.innerHTML;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${editId ? 'Updating...' : 'Enrolling...'}`;

            const formData = new FormData(form);
            try {
                const endpoint = editId ? `/admin/users/${editId}` : '/admin/users/add';
                const options = editId ? { method: 'PUT' } : { method: 'POST' };

                const res = await uploadFile(endpoint, formData, options);

                if (res.success) {
                    showToast(editId ? 'Student updated successfully!' : 'Student enrolled successfully!');
                    if (!editId) {
                        form.reset();
                        removeUIPhoto(new Event('click'));
                    } else {
                        setTimeout(() => window.location.href = 'users.html', 1500);
                    }
                } else {
                    showToast(res.error || (editId ? 'Failed to update student' : 'Failed to enroll student'), 'error');
                }
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalHTML;
            }
        });

        // Drag & Drop
        const dropZone = document.getElementById('photoDropArea');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
        });
        dropZone.addEventListener('drop', e => {
            const files = e.dataTransfer.files;
            if (files.length) {
                document.getElementById('profile_photo').files = files;
                handleUIPreview(document.getElementById('profile_photo'));
            }
        });
    </script>
</body>

</html>
