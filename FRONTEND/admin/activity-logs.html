<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Logs - AL MARAKISH LIBRARY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

<body>
    <div id="sidebar-container"></div>

    <div class="main-content" style="margin-left: 260px; padding: 30px;">
        <div class="page-header"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="font-size: 32px; font-weight: 700;">
                <i class="fas fa-clipboard-list" style="color: #9c4dff;"></i> Activity Logs
            </h1>
            <div style="display: flex; gap: 12px;">
                <button class="btn btn-secondary" onclick="loadLogs()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
                <button class="btn btn-primary" onclick="exportLogs()">
                    <i class="fas fa-download"></i> Export CSV
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-card" style="background: #1e293b; padding: 24px; border-radius: 12px; margin-bottom: 24px;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                <div>
                    <label
                        style="display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px;">Category</label>
                    <select id="filterCategory" class="form-select" onchange="loadLogs()">
                        <option value="">All Categories</option>
                        <option value="system">System</option>
                        <option value="books">Books</option>
                        <option value="users">Users</option>
                        <option value="circulation">Circulation</option>
                        <option value="admins">Admins</option>
                        <option value="maintenance">Maintenance</option>
                    </select>
                </div>
                <div>
                    <label
                        style="display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px;">Severity</label>
                    <select id="filterSeverity" class="form-select" onchange="loadLogs()">
                        <option value="">All Severity</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
                <div>
                    <label
                        style="display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px;">Limit</label>
                    <select id="filterLimit" class="form-select" onchange="loadLogs()">
                        <option value="50">50 records</option>
                        <option value="100">100 records</option>
                        <option value="200">200 records</option>
                        <option value="500">500 records</option>
                    </select>
                </div>
                <div>
                    <label
                        style="display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px;">Search</label>
                    <input type="text" id="searchInput" class="form-input" placeholder="Search logs..."
                        oninput="filterLogsClient()">
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats-grid"
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom:30px;">
            <div class="stat-card"
                style="background: linear-gradient(135deg, #9c4dff, #7c3aed); padding: 20px; border-radius: 12px;">
                <div style="font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 8px;">Total Logs</div>
                <div id="totalLogs" style="font-size: 32px; font-weight: 700; color: white;">0</div>
            </div>
            <div class="stat-card"
                style="background: linear-gradient(135deg, #10b981, #059669); padding: 20px; border-radius: 12px;">
                <div style="font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 8px;">Success Rate</div>
                <div id="successRate" style="font-size: 32px; font-weight: 700; color: white;">0%</div>
            </div>
            <div class="stat-card"
                style="background: linear-gradient(135deg, #f59e0b, #d97706); padding: 20px; border-radius: 12px;">
                <div style="font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 8px;">High Severity</div>
                <div id="highSeverity" style="font-size: 32px; font-weight: 700; color: white;">0</div>
            </div>
            <div class="stat-card"
                style="background: linear-gradient(135deg, #ef4444, #dc2626); padding: 20px; border-radius: 12px;">
                <div style="font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 8px;">Failed Actions</div>
                <div id="failedActions" style="font-size: 32px; font-weight: 700; color: white;">0</div>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="logs-table" style="background: #1e293b; border-radius: 12px; overflow: hidden;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #0f172a;">
                        <th
                            style="padding: 16px; text-align: left; font-size: 13px; font-weight: 600; color: #cbd5e1; border-bottom: 1px solid #334155;">
                            Time</th>
                        <th
                            style="padding: 16px; text-align: left; font-size: 13px; font-weight: 600; color: #cbd5e1; border-bottom: 1px solid #334155;">
                            User</th>
                        <th
                            style="padding: 16px; text-align: left; font-size: 13px; font-weight: 600; color: #cbd5e1; border-bottom: 1px solid #334155;">
                            Action</th>
                        <th
                            style="padding: 16px; text-align: left; font-size: 13px; font-weight: 600; color: #cbd5e1; border-bottom: 1px solid #334155;">
                            Category</th>
                        <th
                            style="padding: 16px; text-align: left; font-size: 13px; font-weight: 600; color: #cbd5e1; border-bottom: 1px solid #334155;">
                            Description</th>
                        <th
                            style="padding: 16px; text-align: left; font-size: 13px; font-weight: 600; color: #cbd5e1; border-bottom: 1px solid #334155;">
                            Status</th>
                        <th
                            style="padding: 16px; text-align: left; font-size: 13px; font-weight: 600; color: #cbd5e1; border-bottom: 1px solid #334155;">
                            Severity</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    <tr>
                        <td colspan="7" style="padding: 60px; text-align: center; color: #64748b;">
                            <i class="fas fa-spinner fa-spin" style="font-size: 32px;"></i>
                            <div style="margin-top: 16px;">Loading logs...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/assets/js/api-helper.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script>
        let allLogs = [];

        // Protect route
        (async function () {
            await protectRoute();
            loadLogs();
        })();

        async function loadLogs() {
            const category = document.getElementById('filterCategory').value;
            const severity = document.getElementById('filterSeverity').value;
            const limit = document.getElementById('filterLimit').value;

            let url = `/owner/logs/activity?limit=${limit}`;
            if (category) url += `&category=${category}`;
            if (severity) url += `&severity=${severity}`;

            try {
                const response = await apiRequest(url);

                if (response.success && response.logs) {
                    allLogs = response.logs;
                    displayLogs(allLogs);
                    updateStatistics(allLogs);
                }
            } catch (error) {
                console.error('Failed to load logs:', error);
                document.getElementById('logsTableBody').innerHTML =
                    '<tr><td colspan="7" style="padding: 40px; text-align: center; color: #ef4444;">Failed to load logs</td></tr>';
            }
        }

        function displayLogs(logs) {
            const tbody = document.getElementById('logsTableBody');

            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="padding: 40px; text-align: center; color: #64748b;">No logs found</td></tr>';
                return;
            }

            tbody.innerHTML = logs.map(log => `
                <tr style="border-bottom: 1px solid #334155; transition: background 0.2s;" onmouseover="this.style.background='rgba(156,77,255,0.05)'" onmouseout="this.style.background=''">
                    <td style="padding: 16px; color: #cbd5e1; font-size: 13px;">${formatDate(log.created_at)}</td>
                    <td style="padding: 16px; color: #cbd5e1; font-size: 13px;">
                        ${escapeHtml(log.user_id || 'System')}
                        ${log.user_role ? `<br><span style="font-size: 11px; color: #64748b;">${log.user_role}</span>` : ''}
                    </td>
                    <td style="padding: 16px; color: #cbd5e1; font-size: 13px; font-weight: 600;">${escapeHtml(log.action_type)}</td>
                    <td style="padding: 16px;">
                        <span style="padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: rgba(156,77,255,0.15); color: #9c4dff;">
                            ${escapeHtml(log.action_category)}
                        </span>
                    </td>
                    <td style="padding: 16px; color: #cbd5e1; font-size: 13px; max-width: 300px;">
                        ${escapeHtml(log.action_description)}
                        ${log.ip_address ? `<br><span style="font-size: 11px; color: #64748b;">IP: ${log.ip_address}</span>` : ''}
                    </td>
                    <td style="padding: 16px;">
                        <span style="padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; ${getStatusStyle(log.status)}">
                            ${log.status}
                        </span>
                    </td>
                    <td style="padding: 16px;">
                        <span style="padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; ${getSeverityStyle(log.severity)}">
                            ${log.severity}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function updateStatistics(logs) {
            document.getElementById('totalLogs').textContent = logs.length;

            const successCount = logs.filter(l => l.status === 'success').length;
            const successRate = logs.length > 0 ? Math.round((successCount / logs.length) * 100) : 0;
            document.getElementById('successRate').textContent = successRate + '%';

            const highSeverityCount = logs.filter(l => l.severity === 'high' || l.severity === 'critical').length;
            document.getElementById('highSeverity').textContent = highSeverityCount;

            const failedCount = logs.filter(l => l.status === 'failed' || l.status === 'error').length;
            document.getElementById('failedActions').textContent = failedCount;
        }

        function filterLogsClient() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            if (!searchTerm) {
                displayLogs(allLogs);
                return;
            }

            const filtered = allLogs.filter(log =>
                log.action_type.toLowerCase().includes(searchTerm) ||
                log.action_description.toLowerCase().includes(searchTerm) ||
                log.action_category.toLowerCase().includes(searchTerm) ||
                (log.user_role && log.user_role.toLowerCase().includes(searchTerm))
            );

            displayLogs(filtered);
        }

        function exportLogs() {
            if (allLogs.length === 0) {
                alert('No logs to export');
                return;
            }

            const csv = convertToCSV(allLogs);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `activity_logs_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function convertToCSV(logs) {
            const headers = ['Time', 'User ID', 'Role', 'Action', 'Category', 'Description', 'IP Address', 'Status', 'Severity'];
            const rows = logs.map(log => [
                formatDate(log.created_at),
                log.user_id || '',
                log.user_role || '',
                log.action_type,
                log.action_category,
                log.action_description.replace(/"/g, '""'),
                log.ip_address || '',
                log.status,
                log.severity
            ]);

            return [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');
        }

        function getStatusStyle(status) {
            const styles = {
                'success': 'background: rgba(16, 185, 129, 0.15); color: #10b981;',
                'failed': 'background: rgba(239, 68, 68, 0.15); color: #ef4444;',
                'error': 'background: rgba(239, 68, 68, 0.15); color: #ef4444;'
            };
            return styles[status] || 'background: rgba(100, 116, 139, 0.15); color: #64748b;';
        }

        function getSeverityStyle(severity) {
            const styles = {
                'low': 'background: rgba(16, 185, 129, 0.15); color: #10b981;',
                'medium': 'background: rgba(245, 158, 11, 0.15); color: #f59e0b;',
                'high': 'background: rgba(239, 68, 68, 0.15); color: #ef4444;',
                'critical': 'background: rgba(153, 27, 27, 0.15); color: #991b1b;'
            };
            return styles[severity] || 'background: rgba(100, 116, 139, 0.15); color: #64748b;';
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
</body>

</html>
