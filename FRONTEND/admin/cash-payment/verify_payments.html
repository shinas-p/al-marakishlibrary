<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Payments - Al Marakish Library</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #9c4dff;
            --bg-dark: #0f1724;
            --card-bg: #1e293b;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: white;
            line-height: 1.6;
        }

        .main-content {
            margin-left: 240px;
            padding: 32px;
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .payment-list {
            display: grid;
            gap: 24px;
        }

        .payment-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .payment-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--warning);
        }

        .payment-card.Success::before {
            background: var(--success);
        }

        .payment-card.Rejected::before {
            background: var(--danger);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .student-name {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        .amount {
            font-size: 24px;
            font-weight: 800;
            color: var(--success);
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: var(--bg-dark);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .detail-item {
            font-size: 14px;
        }

        .detail-label {
            display: block;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .proof-section {
            margin-top: 15px;
        }

        .proof-img {
            max-width: 300px;
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .proof-img:hover {
            transform: scale(1.02);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-approve {
            background: var(--success);
            color: white;
        }

        .btn-reject {
            background: var(--danger);
            color: white;
        }

        .history-table-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-top: 50px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            text-align: left;
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .status-badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-Success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-Rejected {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .status-Pending {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        @media (max-width: 900px) {
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="page-header">
            <div style="margin-bottom: 12px;">
                <a href="index.html"
                    style="color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-arrow-left"></i> Fine Collection Dashboard
                </a>
            </div>
            <h1><i class="fas fa-file-invoice-dollar"></i> UPI Payment Verifications</h1>
        </div>

        <h2 style="font-size: 18px; margin-bottom: 20px;">Pending Verifications</h2>
        <div id="pendingList" class="payment-list">
            <!-- Pending payments here -->
        </div>

        <div class="history-table-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="font-size: 18px;">Recent Verification History</h2>
                <a href="payment_history.html"
                    style="color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 600;">View Full
                    History <i class="fas fa-arrow-right"></i></a>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Amount</th>
                            <th>Payment ID</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- History here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/assets/js/api-helper.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script>
        // Load Sidebar
        fetch('/admin/sidebar.html').then(res => res.text()).then(data => {
            document.getElementById('sidebar-container').innerHTML = data;
            if (typeof initSidebar === 'function') initSidebar();
        });

        protectRoute();

        window.addEventListener('DOMContentLoaded', () => {
            loadPendingPayments();
            loadPaymentHistory();
        });

        async function loadPendingPayments() {
            const list = document.getElementById('pendingList');
            list.innerHTML = '<div style="text-align: center; padding: 40px; color: #64748b;">Loading pending payments...</div>';

            try {
                const response = await apiRequest('/admin/payments?status=Pending');
                if (response.success && response.payments.length > 0) {
                    list.innerHTML = response.payments.map(p => `
                        <div class="payment-card Pending">
                            <div class="card-header">
                                <div>
                                    <div class="student-name">${p.full_name}</div>
                                    <div style="font-size: 13px; color: #94a3b8;">AD No: ${p.ad_no} | ID: #${p.id}</div>
                                </div>
                                <div class="amount">₹${parseFloat(p.amount).toFixed(2)}</div>
                            </div>
                            <div class="details-grid">
                                <div class="detail-item"><span class="detail-label">Transaction ID</span><strong>${p.payment_reference}</strong></div>
                                <div class="detail-item"><span class="detail-label">Method</span><strong>${p.payment_method}</strong></div>
                                <div class="detail-item"><span class="detail-label">Submitted On</span><strong>${new Date(p.submitted_at).toLocaleString()}</strong></div>
                            </div>
                            ${p.payment_screenshot ? `
                                <div class="proof-section">
                                    <span class="detail-label">Payment Proof</span>
                                    <img src="/uploads/payment_proofs/${p.payment_screenshot}" class="proof-img" onclick="window.open('/uploads/payment_proofs/${p.payment_screenshot}')">
                                </div>
                            ` : ''}
                            <div class="actions">
                                <button class="btn btn-approve" onclick="verifyPayment(${p.id}, 'approve')"><i class="fas fa-check"></i> Approve</button>
                                <button class="btn btn-reject" onclick="verifyPayment(${p.id}, 'reject')"><i class="fas fa-times"></i> Reject</button>
                            </div>
                            ${!p.is_screenshot_requested && !p.payment_screenshot ? `
                                <div style="margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px;">
                                    <button class="btn" style="background: #3b82f6; color: white; width: 100%;" onclick="requestScreenshot(${p.id})">
                                        <i class="fas fa-camera"></i> Request Screenshot
                                    </button>
                                </div>
                            ` : ''}
                            ${p.is_screenshot_requested && !p.payment_screenshot ? `
                                <div style="margin-top: 10px; text-align: center; color: var(--warning); font-size: 13px;">
                                    <i class="fas fa-hourglass-half"></i> Screenshot requested
                                </div>
                            ` : ''}
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = `
                        <div style="background: var(--card-bg); padding: 50px; text-align: center; border-radius: 16px; border: 1px dashed var(--border);">
                            <i class="fas fa-smile" style="font-size: 40px; color: var(--success); margin-bottom: 10px; opacity: 0.5;"></i>
                            <p style="color: #64748b;">All payments are cleared!</p>
                        </div>
                    `;
                }
            } catch (err) {
                list.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--danger);">Error loading payments.</div>';
            }
        }

        async function loadPaymentHistory() {
            const tbody = document.getElementById('historyTableBody');
            try {
                const response = await apiRequest('/admin/payments?limit=20');
                if (response.success) {
                    tbody.innerHTML = response.payments.map(p => `
                        <tr>
                            <td>
                                <strong>${p.full_name}</strong><br>
                                <small style="color: #64748b">${p.ad_no}</small>
                            </td>
                            <td><strong>₹${parseFloat(p.amount).toFixed(2)}</strong></td>
                            <td><code style="font-size: 12px;">${p.payment_reference}</code></td>
                            <td>${new Date(p.submitted_at).toLocaleDateString()}</td>
                            <td><span class="status-badge status-${p.status}">${p.status}</span></td>
                        </tr>
                    `).join('');
                }
            } catch (err) { }
        }

        async function verifyPayment(id, action) {
            const confirmed = await showModal({
                title: `${action.charAt(0).toUpperCase() + action.slice(1)} Payment`,
                message: `Are you sure you want to ${action} this student payment? This action will update their fine status immediately.`,
                type: 'confirm',
                confirmText: action === 'approve' ? 'Approve' : 'Reject'
            });

            if (!confirmed) return;

            try {
                const response = await apiRequest(`/admin/payments/${id}/verify`, {
                    method: 'POST',
                    body: JSON.stringify({ action: action === 'approve' ? 'Approved' : 'Rejected' })
                });

                if (response.success) {
                    showToast(`Payment ${action}d successfully.`, 'success');
                    loadPendingPayments();
                    loadPaymentHistory();
                } else {
                    showToast(response.error || 'Verification failed.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast(err.message || 'A network error occurred.', 'error');
            }
        }

        async function requestScreenshot(id) {
            const confirmed = await showModal({
                title: 'Request Screenshot',
                message: 'Ask the student to upload a payment screenshot? This will create a notification for them.',
                type: 'confirm',
                confirmText: 'Request'
            });

            if (!confirmed) return;

            try {
                const response = await apiRequest(`/admin/payments/${id}/request-screenshot`, {
                    method: 'POST'
                });

                if (response.success) {
                    showToast('Screenshot request sent.', 'success');
                    loadPendingPayments();
                } else {
                    showToast(response.error || 'Failed to request.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast(err.message || 'A network error occurred.', 'error');
            }
        }
    </script>
</body>

</html>
