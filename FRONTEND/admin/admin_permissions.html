<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Override | Al Marakish Library</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/owner-pages.css">
    <style>
        :root {
            --neon-blue: #3b82f6;
            --neon-purple: #8b5cf6;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shine: rgba(255, 255, 255, 0.03);
            --danger-glow: #ef4444;
            --success-glow: #10b981;
        }

        body {
            background-color: #0f172a;
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }

        .main-content {
            padding: 40px;
            margin-left: 280px;
            /* Aligned with sidebar + extra breathing room */
            min-height: 100vh;
        }

        /* --- Header --- */
        .security-header {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-bottom: 2px solid var(--neon-purple);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            letter-spacing: -0.5px;
        }

        .header-title h1 i {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px;
        }

        .header-title p {
            color: #94a3b8;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        /* --- Grid Layouts --- */
        .identity-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .details-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 0 20px rgba(255, 255, 255, 0.02);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .details-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.05),
                    transparent);
            transition: 0.5s;
        }

        .details-card:hover::before {
            left: 100%;
        }

        .details-card:hover {
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.2),
                inset 0 0 20px rgba(139, 92, 246, 0.05);
            transform: translateY(-2px);
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: white;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--neon-blue);
        }

        /* --- Inputs --- */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .glass-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .glass-input:focus {
            outline: none;
            border-color: var(--neon-blue);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3),
                inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        /* --- Buttons --- */
        .btn-neon {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
        }

        .btn-update {
            background: linear-gradient(135deg, var(--neon-blue), #2563eb);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-top: 10px;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }

        /* --- Permission Matrix --- */
        .matrix-title-row {
            margin: 40px 0 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .mandate-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 25px;
            transition: transform 0.3s ease;
        }

        .mandate-card:hover {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .mandate-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--neon-blue);
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
        }

        .mandate-header i {
            font-size: 20px;
        }

        /* Custom Checkboxes */
        .permission-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.2s;
            cursor: pointer;
        }

        .permission-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .checkbox-wrapper {
            position: relative;
            width: 20px;
            height: 20px;
            margin-right: 15px;
        }

        .checkbox-wrapper input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 20px;
            width: 20px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px solid #475569;
            border-radius: 6px;
            transition: 0.2s;
        }

        .checkbox-wrapper input:checked~.checkmark {
            background-color: var(--neon-purple);
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .checkbox-wrapper input:checked~.checkmark:after {
            display: block;
        }

        .checkbox-wrapper .checkmark:after {
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .perm-label {
            font-size: 14px;
            color: #cbd5e1;
            user-select: none;
        }

        .perm-label.sensitive {
            color: #fca5a5;
        }

        /* --- Footer Action --- */
        .action-footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid var(--glass-border);
        }

        .btn-deploy {
            width: 100%;
            padding: 20px;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
            border: none;
            border-radius: 16px;
            color: white;
            font-family: 'Outfit', sans-serif;

            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-deploy:hover {
            transform: scale(1.01);
            box-shadow: 0 15px 50px rgba(139, 92, 246, 0.5);
            filter: brightness(1.1);
        }

        .btn-deploy i {
            margin-right: 15px;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', loadAdminData);

        async function loadAdminData() {
            const urlParams = new URLSearchParams(window.location.search);
            const adminId = urlParams.get('id');

            // FALLBACK: Load some default data if no ID is provided, so it doesn't look empty
            if (!adminId) {
                populateForm({
                    full_name: 'Library Admin',
                    email: 'admin@almarakish.com',
                    role: 'admin',
                    status: 'active'
                });
                return;
            }

            // Show loading state...
            document.getElementById('p_fullname').placeholder = "Loading core intelligence...";

            try {
                const response = await apiRequest('/admin/owner/admins');
                if (response.success && response.admins) {
                    const admin = response.admins.find(a => a.id == adminId);
                    if (admin) {
                        populateForm(admin);
                    } else {
                        showToast('Matrix mismatch: Admin not found', 'error');
                    }
                }
            } catch (error) {
                console.error('Failed to load admin:', error);
                showToast('Intelligence fetch failed', 'error');
            }
        }

        function populateForm(admin) {
            document.getElementById('p_fullname').value = admin.full_name || '';
            document.getElementById('p_email').value = admin.email || '';
            document.getElementById('p_role').value = admin.role;
            document.getElementById('p_status').value = admin.status;

            // Priority: Restricted Granular Permissions > Role Defaults
            if (admin.permissions) {
                try {
                    const savedPerms = typeof admin.permissions === 'string' ? JSON.parse(admin.permissions) : admin.permissions;
                    if (Array.isArray(savedPerms) && savedPerms.length > 0) {
                        restorePermissions(savedPerms);
                        return;
                    }
                } catch (e) {
                    console.error('Failed to parse saved permissions', e);
                }
            }

            // Fallback to Role Defaults
            updatePermissionsUI(admin.role);
        }

        function restorePermissions(permsList) {
            const allCheckboxes = document.querySelectorAll('.permission-item input[type="checkbox"]');
            allCheckboxes.forEach(cb => {
                const label = cb.closest('.permission-item').querySelector('.perm-label').textContent.trim();
                cb.checked = permsList.includes(label);
            });
        }

        function updatePermissionsUI(role) {
            const allCheckboxes = document.querySelectorAll('.permission-item input[type="checkbox"]');

            // Define rules
            const rules = {
                owner: 'ALL', // Check everything
                admin: {
                    exclude: [
                        'Delete Admin Accounts',
                        'Update System Settings (Restricted)',
                        'Delete Students (Sensitive)',
                        'Toggle Read-Only Mode',
                        'Edit Admin Permissions'
                    ]
                },
                assistant: {
                    include: [
                        'View Books Catalog', 'Add New Books', 'Edit Book Details',
                        'View Student Records', 'Register New Students', 'Edit Student Details',
                        'Manual Book Issue (Check-Out)', 'Process Book Returns (Check-In)', 'Approve Renewal Requests',
                        'View Fine Records', 'Verify Payment Submissions',
                        'View Book Issue Audit Trail', 'Print Book Labels'
                    ]
                }
            };

            allCheckboxes.forEach(cb => {
                const label = cb.closest('.permission-item').querySelector('.perm-label').textContent.trim();

                if (role === 'owner') {
                    cb.checked = true;
                } else if (role === 'admin') {
                    cb.checked = !rules.admin.exclude.includes(label);
                } else if (role === 'assistant') {
                    cb.checked = rules.assistant.include.includes(label);
                }
            });
        }

        async function updateAdminProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const adminId = urlParams.get('id');
            if (!adminId) return showToast('No admin selected', 'error');

            const data = {
                full_name: document.getElementById('p_fullname').value,
                email: document.getElementById('p_email').value,
                role: document.getElementById('p_role').value,
                status: document.getElementById('p_status').value
            };

            try {
                const response = await apiRequest(`/admin/owner/admins/${adminId}`, {
                    method: 'PUT',
                    body: JSON.stringify(data)
                });
                if (response.success) {
                    showToast('Profile updated successfully', 'success');
                    setTimeout(() => window.location.href = 'owner_admins.html', 1500);
                }
            } catch (error) {
                showToast('Update failed: ' + error.message, 'error');
            }
        }

        async function forcePasswordReset() {
            const urlParams = new URLSearchParams(window.location.search);
            const adminId = urlParams.get('id');
            const password = document.getElementById('p_new_password').value;

            if (!password || password.length < 6) return showToast('Minimum 6 characters', 'warning');

            if (!confirm('CRITICAL: Are you sure you want to FORCE OVERWRITE this password?')) return;

            try {
                const response = await apiRequest(`/admin/owner/admins/${adminId}/password`, {
                    method: 'PUT',
                    body: JSON.stringify({ password })
                });
                if (response.success) {
                    showToast('Credentials overwritten', 'success');
                    document.getElementById('p_new_password').value = '';
                    setTimeout(() => window.location.href = 'owner_admins.html', 1500);
                }
            } catch (error) {
                showToast('Reset failed: ' + error.message, 'error');
            }
        }

        async function deployPermissions() {
            const urlParams = new URLSearchParams(window.location.search);
            const adminId = urlParams.get('id');
            if (!adminId) return showToast('Matrix deployment requires target ID', 'warning');

            // Collecting checked permissions
            const checkedPerms = [];
            document.querySelectorAll('.permission-item input[type="checkbox"]:checked').forEach(cb => {
                checkedPerms.push(cb.closest('.permission-item').querySelector('.perm-label').textContent.trim());
            });

            showToast('Initializing Matrix Deployment...', 'info');

            try {
                const response = await apiRequest(`/admin/owner/admins/${adminId}/permissions`, {
                    method: 'PUT',
                    body: JSON.stringify({ permissions: checkedPerms })
                });

                if (response.success) {
                    showToast(`${checkedPerms.length} Mandates Deployed Successfully`, 'success');
                    setTimeout(() => window.location.href = 'owner_admins.html', 1500);
                }
            } catch (error) {
                showToast('Deployment failed: ' + error.message, 'error');
            }
        }
    </script>
</body>

</html>
