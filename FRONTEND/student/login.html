<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL MARAKISH LIBRARY - Student Portal Login</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="../assets/js/api-helper.js"></script>
    <style>
        :root {
            --primary: #1a2e2e;
            --primary-light: #2d4a4a;
            --accent: #cf9d7c;
            --gold: #ddc9b4;
            --bg-dark: #080c0c;
            --glass-bg: rgba(26, 46, 46, 0.6);
            --glass-border: rgba(221, 201, 180, 0.12);
            --text-main: #e8e3d5;
            --text-muted: #94a3a3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            background-image:
                radial-gradient(at 0% 0%, rgba(26, 46, 46, 0.4) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(207, 157, 124, 0.1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-box {
            width: 100px;
            height: 100px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            border: 2px solid var(--gold);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 18px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.2));
        }

        .login-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--gold), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 500;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .error-msg.show {
            display: flex;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: var(--accent);
            font-weight: 800;
            margin-bottom: 12px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 18px;
            opacity: 0.6;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px 16px 54px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(207, 157, 124, 0.05);
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #b8865c);
            color: #1a2e2e;
            font-size: 18px;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 15px 35px rgba(207, 157, 124, 0.3);
            margin-top: 10px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 20px 45px rgba(207, 157, 124, 0.5);
            filter: brightness(1.1);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .admin-link {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--glass-border);
        }

        .admin-link a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .admin-link a:hover {
            color: var(--accent);
            transform: scale(1.05);
        }

        .help-text {
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-header">
            <div class="logo-box">
                <img src="../logo1.png" alt="AL MARAKISH LIBRARY Logo">
            </div>
            <h1>AL MARAKISH LIBRARY</h1>
            <p>Student Portal - Track your books and fines</p>
        </div>

        <div class="login-card">
            <div id="errorMessage" class="error-msg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="ad_no">
                        <i class="fas fa-id-card"></i> Admission Number
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-hashtag"></i>
                        <input type="text" id="ad_no" name="ad_no" placeholder="Enter your Ad No" required autofocus
                            autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required
                            autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="login-btn" id="submitBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Sign In</span>
                </button>

                <p class="help-text">
                    <i class="fas fa-info-circle"></i>
                    Use your Admission Number and Password to login
                </p>
            </form>

            <div class="admin-link">
                <a href="../admin/login.html">
                    <i class="fas fa-user-shield"></i> Admin Login
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const adNo = document.getElementById('ad_no').value.trim();
            const password = document.getElementById('password').value;

            // Hide error
            errorDiv.classList.remove('show');

            // Validate
            if (!adNo || !password) {
                errorText.textContent = 'Please enter both Admission Number and Password';
                errorDiv.classList.add('show');
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';

            try {
                const data = await apiRequest('/auth/student/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        ad_no: adNo,
                        password: password
                    })
                });

                if (data.success && data.token) {
                    localStorage.setItem('token', data.token);
                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }
                    window.location.href = 'dashboard.html';
                } else {
                    errorText.textContent = data.error || 'Invalid Admission Number or Password';
                    errorDiv.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Sign In</span>';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorText.textContent = error.message || 'Login error. Please try again.';
                errorDiv.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Sign In</span>';
            }
        });
    </script>

</body>

</html>
