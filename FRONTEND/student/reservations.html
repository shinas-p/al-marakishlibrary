<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reservations | Al Marakish Library</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a2e2e;
            --primary-light: #2d4a4a;
            --accent: #cf9d7c;
            --gold: #ddc9b4;
            --bg-dark: #080c0c;
            --glass-bg: rgba(26, 46, 46, 0.6);
            --glass-border: rgba(221, 201, 180, 0.12);
            --text-main: #e8e3d5;
            --text-muted: #94a3a3;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            background-image:
                radial-gradient(at 0% 0%, rgba(26, 46, 46, 0.4) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(207, 157, 124, 0.1) 0, transparent 50%);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        .navbar-brand {
            font-family: 'Outfit', sans-serif;
        }

        .navbar {
            background: rgba(13, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--gold), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid transparent;
        }

        .nav-btn:hover {
            background: rgba(221, 201, 180, 0.05);
            border-color: var(--glass-border);
            color: var(--accent);
        }

        .nav-btn.active {
            background: rgba(207, 157, 124, 0.15);
            border-color: rgba(207, 157, 124, 0.3);
            color: var(--accent);
        }

        .user-meta {
            margin-left: 20px;
            padding-left: 20px;
            border-left: 1px solid var(--glass-border);
            text-align: left;
        }

        .user-name {
            font-weight: 700;
            font-size: 15px;
            display: block;
            color: var(--gold);
        }

        .user-id {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            border: 1px solid rgba(239, 68, 68, 0.2);
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-back {
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }

        .btn-back:hover {
            background: rgba(207, 157, 124, 0.1);
            color: var(--accent);
            border-color: var(--accent);
        }

        .res-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 24px;
        }

        .res-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--card-radius);
            padding: 28px;
            border: 1px solid var(--glass-border);
            display: flex;
            gap: 24px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .res-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            background: rgba(26, 46, 46, 0.8);
        }

        .book-cover {
            width: 90px;
            height: 130px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            background: var(--bg-dark);
        }

        .res-details {
            flex: 1;
        }

        .res-status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .status-ready {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-completed {
            background: rgba(221, 201, 180, 0.1);
            color: var(--gold);
            border: 1px solid var(--glass-border);
        }

        .status-cancelled {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .book-title {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .res-info {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ready-notice {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            margin-top: 10px;
        }

        .ready-notice i {
            margin-top: 3px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 40px;
            background: var(--glass-bg);
            border-radius: var(--card-radius);
            border: 2px dashed var(--glass-border);
        }

        .empty-state i {
            font-size: 72px;
            color: var(--accent);
            opacity: 0.2;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .res-card {
                flex-direction: column;
                text-align: center;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fas fa-book-reader" style="color: var(--accent);"></i>
            AL MARAKISH LIBRARY
        </div>
        <div class="navbar-user">
            <a href="dashboard.html" class="nav-btn">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="notifications.html" class="nav-btn">
                <i class="fas fa-bell"></i> Notifications
            </a>
            <a href="profile.html" class="nav-btn">
                <i class="fas fa-user-circle"></i> Profile
            </a>
            <a href="reservations.html" class="nav-btn active">
                <i class="fas fa-bookmark"></i> Reservations
            </a>
            <a href="suggestions.html" class="nav-btn">
                <i class="fas fa-lightbulb"></i> Wishlist
            </a>
            <a href="pay_fine.html" class="nav-btn">
                <i class="fas fa-wallet"></i> Payments
            </a>
            <a href="../opac/index.html" class="nav-btn">
                <i class="fas fa-search"></i> OPAC
            </a>

            <div class="user-meta">
                <span class="user-name" id="userName">Student Name</span>
                <span class="user-id" id="userAdNo">AD NO: --</span>
            </div>

            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-power-off"></i>
            </button>
        </div>
    </nav>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-bookmark" style="color: var(--accent);"></i> My Reservations</h1>
            <a href="/student/dashboard.html" class="btn-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
        </div>

        <div id="reservationList" class="res-grid">
            <div class="empty-state">
                <i class="fas fa-circle-notch fa-spin fa-3x" style="color: var(--accent); margin-bottom: 20px;"></i>
                <p>Loading your reservations...</p>
            </div>
        </div>
    </div>

    <script src="/assets/js/api-helper.js"></script>
    <script>
        protectRoute('student');

        // Get user info
        const user = getUser();
        if (user) {
            document.getElementById('userName').textContent = user.full_name || 'Student';
            document.getElementById('userAdNo').textContent = `Ad No: ${user.ad_no || '—'}`;
        }

        document.addEventListener('DOMContentLoaded', loadMyReservations);

        async function loadMyReservations() {
            const list = document.getElementById('reservationList');
            try {
                const response = await apiRequest('/opac/reservations');
                if (response.success) {
                    if (response.reservations.length === 0) {
                        list.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-inbox fa-3x" style="opacity: 0.2; margin-bottom: 20px;"></i>
                                <h3>No Reservations Found</h3>
                                <p style="color: var(--text-muted);">You haven't reserved any books yet.</p>
                                <a href="/opac/index.html" style="display: inline-block; margin-top: 20px; color: var(--primary); font-weight: 700;">Browse Books</a>
                            </div>
                        `;
                        return;
                    }

                    list.innerHTML = response.reservations.map(r => `
                        <div class="res-card">
                            <img src="${r.cover_image ? `/uploads/covers/${r.cover_image}` : '/assets/default-book-cover.png'}" class="book-cover">
                            <div class="res-details">
                                <span class="res-status status-${r.status.toLowerCase()}">${r.status}</span>
                                <h3 class="book-title">${r.title}</h3>
                                <p class="res-info">Reserved: ${new Date(r.reservation_date).toLocaleDateString()}</p>
                                
                                ${r.status === 'Ready' ? `
                                    <div class="ready-notice">
                                        <i class="fas fa-info-circle"></i>
                                        Book is ready for pick-up at the library. Exp: ${new Date(r.expiration_date).toLocaleDateString()}
                                    </div>
                                ` : ''}
                                
                                ${r.status === 'Pending' ? `
                                    <p style="font-size: 11px; color: var(--warning);"><i class="fas fa-hourglass-half"></i> Waiting for librarian approval...</p>
                                ` : ''}
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                list.innerHTML = `<div class="empty-state"><p style="color: var(--danger);">Failed to load reservations.</p></div>`;
            }
        }
    </script>
</body>

</html>
